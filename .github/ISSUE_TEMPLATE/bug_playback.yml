name: "Bug: Playback"
description: Report a video/audio playback issue
title: "[Playback] "
labels: ["Bug", "Playback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out as much as you can, playback issues are very environment + media dependent.

  - type: input
    id: app_version
    attributes:
      label: Moonfin version
      description: The app version / release tag (e.g., v2.0.0)
      placeholder: v2.0.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Tizen (Samsung)
        - webOS (LG)
    validations:
      required: true

  - type: input
    id: platform_version
    attributes:
      label: Platform version
      description: "Tizen example: Tizen 4 / 5.0 / 6.5 / 7.0 \nwebOS example: webOS 4 / 6.x / 23 / 24"
      placeholder: e.g. Tizen 6.5 or webOS 23
    validations:
      required: true

  - type: input
    id: tv_model
    attributes:
      label: TV model
      description: "Samsung example: UN55TU8000 \nLG example: OLED55C1PUA"
    validations:
      required: false

  - type: input
    id: jellyfin_version
    attributes:
      label: Jellyfin server version
      placeholder: 10.x.x
    validations:
      required: true

  - type: dropdown
    id: item_type
    attributes:
      label: Content type
      options:
        - Movie
        - Episode
        - Live TV
        - Other
    validations:
      required: true

  - type: textarea
    id: media_info
    attributes:
      label: Media details (as much as you know, check the info button at the bottom right of the player)
      description: Container, resolution, HDR type, video codec/profile, audio codec/channels, subtitle type, bitrate
      placeholder: |
        Container: MKV
        Resolution: 3840x2160
        HDR: HDR10
        Video: HEVC Main10@L5.1
        Audio: EAC3 5.1
        Subs: PGS (enabled)
        Bitrate: ~25 Mbps
    validations:
      required: true

  - type: dropdown
    id: playback_path
    attributes:
      label: Playback path
      options:
        - Direct Play
        - Transcode
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: symptoms
    attributes:
      label: Symptoms (check all that apply)
      options:
        - label: Black screen / endless spinner
        - label: Audio only (no video)
        - label: Stuttering / frame drops
        - label: A/V sync issues
        - label: Seeking/scrubbing broken
        - label: Subtitles missing or incorrect
        - label: Unexpected forced transcode
        - label: App crashes / exits

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Press Play ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostic report
      description: |
        Diagnostic logging is off by default and is kept in memory only, so turn it on before you reproduce the problem. There's no log file on the TV to go looking for.

        1. Settings > About > Debugging, turn on "Diagnostic Logging"
        2. Reproduce the problem, and don't close the app afterwards, closing it clears the buffer
        3. Settings > About > Debugging > View Logs, press "Send Report"

        "Send Report" uploads to your own Jellyfin server, not to us. Fetch it from that server under Administration > Logs. It's the newest file whose name starts with "upload_Moonfin for Tizen_" or "upload_Moonfin for webOS_". Attach that file here.

        If you have no access to that server, photograph the View Logs screen instead and say so here.
      render: shell
    validations:
      required: true
