name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────
  # webOS IPK
  # ───────────────────────────────────────────────
  build-webos:
    name: Build webOS
    runs-on: ubuntu-26.04
    outputs:
      result: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Build webOS
        id: build
        run: npm run build:webos

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: webos
          path: |
            Moonfin_webOS_*.ipk
            packages/build-webos/org.moonfin.webos.manifest.json

  # ───────────────────────────────────────────────
  # Tizen WGTs (Regular, Oblong, Legacy)
  # ───────────────────────────────────────────────
  build-tizen:
    name: Build Tizen
    runs-on: ubuntu-26.04
    outputs:
      result: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Build Tizen (all variants)
        id: build
        run: npm run build:tizen:all

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: tizen
          path: Moonfin_Tizen_*.wgt

  # ───────────────────────────────────────────────
  # Vega VPKG and shell checks
  # ───────────────────────────────────────────────
  build-vega:
    name: Build Vega
    # Deadsnakes doesn't build Python 3.8 for the amd64v3 packages the 26.04 runners install from.
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Amazon lists libpython3.8 as an SDK prerequisite, and this Ubuntu only gets it
      # from deadsnakes. The virtual device is skipped since it cant run WebView apps.
      - name: Install the Vega SDK
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.8-dev
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | NONINTERACTIVE=true SKIP_VVD_INSTALL=true bash

      - name: Install dependencies
        run: |
          npm ci --force
          npm ci --no-audit --no-fund --prefix packages/build-vega/shell

      - name: Build Vega
        id: build
        run: |
          source ~/vega/env
          npm run build:vega

      - name: Check the shell
        working-directory: packages/build-vega/shell
        run: |
          npm run typecheck
          npm run lint
          npm test

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: vega
          path: Moonfin_Vega_*.vpkg

  # ───────────────────────────────────────────────
  # Xbox MSIX, zipped with the dependencies a console needs
  # ───────────────────────────────────────────────
  build-xbox:
    name: Build Xbox
    runs-on: windows-latest
    outputs:
      result: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Build Xbox
        id: build
        run: npm run build:xbox

      - name: Zip the package and its dependencies
        shell: pwsh
        run: |
          $msix = Get-Item Moonfin_Xbox_v*.msix
          New-Item -ItemType Directory xbox-zip/Dependencies | Out-Null
          Copy-Item $msix xbox-zip/
          Copy-Item packages/build-xbox/shell/Moonfin.Xbox/AppPackages/*/Dependencies/x64/*.appx xbox-zip/Dependencies/
          if (-not (Get-ChildItem xbox-zip/Dependencies)) { throw 'MSBuild left no dependencies to zip' }
          Compress-Archive xbox-zip/* "$($msix.BaseName).zip"

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: xbox
          path: Moonfin_Xbox_*.zip

      # Partner Center re-signs what it publishes, so the throwaway certificate build.js
      # makes for the Store publisher is all the upload needs. It runs after the zip
      # since each build clears AppPackages.
      - name: Build the Store upload
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build:xbox -- --store --no-web

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: xbox-store
          path: Moonfin_Xbox_Store_*.msixupload

  # ───────────────────────────────────────────────
  # Jest suite
  # ───────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-26.04
    outputs:
      result: ${{ steps.jest.outcome }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Run tests
        id: jest
        run: npm test --workspace @moonfin/app

  # ───────────────────────────────────────────────
  # Save PR build outcomes for pr-comment workflow
  # ───────────────────────────────────────────────
  save-pr-results:
    name: Save PR Build Results
    # Without always() a failed build skips this job, no artifact is uploaded, and
    # the comment workflow has nothing to read, so the run that most needs a comment
    # is the one that never gets one.
    if: always() && github.event_name == 'pull_request'
    needs: [build-webos, build-tizen, build-vega, build-xbox, test]
    runs-on: ubuntu-26.04
    steps:
      - name: Write outcomes.json
        run: |
          cat > outcomes.json <<EOF
          {
            "pr_number": ${{ github.event.pull_request.number }},
            "sha": "${{ github.event.pull_request.head.sha }}",
            "webos": "${{ needs.build-webos.outputs.result }}",
            "tizen": "${{ needs.build-tizen.outputs.result }}",
            "vega": "${{ needs.build-vega.outputs.result }}",
            "xbox": "${{ needs.build-xbox.outputs.result }}",
            "tests": "${{ needs.test.outputs.result }}"
          }
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: build-results
          path: outcomes.json

  # ───────────────────────────────────────────────
  # GitHub Draft Release (tags only)
  # ───────────────────────────────────────────────
  release:
    name: Create Draft Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-webos, build-tizen, build-vega, build-xbox]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          # The webOS artifact keeps the manifest in its folder. The asset is still named after
          # the file, and it carries the hash of the package uploaded next to it.
          files: |
            Moonfin_webOS_*.ipk
            Moonfin_Tizen_*.wgt
            Moonfin_Vega_*.vpkg
            Moonfin_Xbox_*.zip
            packages/build-webos/org.moonfin.webos.manifest.json
