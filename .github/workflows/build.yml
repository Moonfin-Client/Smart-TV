name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]
  # Fires only once a merge queue is enabled on main.
  merge_group:

permissions:
  contents: write

# A new push to a pull request replaces its running build. Every other run
# gets a group of its own, so tags, manual runs and merge groups never queue
# or cancel.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-webos:
    name: Build webOS
    runs-on: ubuntu-26.04
    # Installed TVs download updates from this repo's releases, /<tag>/moonfin-ota-webos.json
    # and .bin, and trust only the key their package was built with, so public.pem never changes.
    env:
      MOONFIN_OTA_URL: https://github.com/${{ github.repository }}/releases/download
      MOONFIN_OTA_PUBLIC_KEY: scripts/ota/public.pem
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      # The webOS CLI, pinned to the version earlier releases were packaged with.
      - name: Install dependencies
        run: |
          npm ci
          npm install -g @webos-tools/cli@3.2.5

      # The update manifest carries package.json's version, and the loader only takes a
      # manifest whose version is the tag it asked for.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./package.json').version")"

      # Tagged builds sign the in-app update with a key only CI holds. Without the
      # secret the packages still build, just without update files to attach.
      - name: Load the update signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEY: ${{ secrets.MOONFIN_OTA_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/ota-signing.pem"
            echo "MOONFIN_OTA_SIGNING_KEY=$RUNNER_TEMP/ota-signing.pem" >> "$GITHUB_ENV"
          fi
      - name: Build webOS
        id: build
        run: npm run package:webos

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: webos
          path: |
            out/Moonfin_webOS_*.ipk
            out/moonfin-ota-webos.*
            out/org.moonfin.webos.manifest.json

  build-tizen:
    name: Build Tizen
    runs-on: ubuntu-26.04
    env:
      MOONFIN_OTA_URL: https://github.com/${{ github.repository }}/releases/download
      MOONFIN_OTA_PUBLIC_KEY: scripts/ota/public.pem
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./package.json').version")"

      - name: Load the update signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEY: ${{ secrets.MOONFIN_OTA_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/ota-signing.pem"
            echo "MOONFIN_OTA_SIGNING_KEY=$RUNNER_TEMP/ota-signing.pem" >> "$GITHUB_ENV"
          fi

      # Releases go out unsigned, as they always have. A Samsung certificate only
      # covers the TVs registered on it, so Apps2Samsung or the user's own Tizen tooling
      # signs the wgt for each TV. Oblong is the same package with the 1920x1080 launcher
      # icon. Icons aren't part of the update's shell hash, so both take the same update files.
      - name: Build Tizen (all variants)
        id: build
        run: |
          npm run package:tizen -- --unsigned
          version=$(node -p "require('./package.json').version")
          mv "out/Moonfin_Tizen_Regular_v$version.wgt" "$RUNNER_TEMP/regular.wgt"
          cp packaging/tizen/icon-oblong.png packaging/tizen/icon.png
          node scripts/package.mjs tizen --unsigned
          mv "out/Moonfin_Tizen_Regular_v$version.wgt" "out/Moonfin_Tizen_Oblong_v$version.wgt"
          mv "$RUNNER_TEMP/regular.wgt" "out/Moonfin_Tizen_Regular_v$version.wgt"

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: tizen
          path: |
            out/Moonfin_Tizen_*.wgt
            out/moonfin-ota-tizen.*

  build-vega:
    name: Build Vega
    # Deadsnakes doesn't build Python 3.8 for the amd64v3 packages the 26.04 runners install from.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Amazon lists libpython3.8 as an SDK prerequisite, and this Ubuntu only gets it
      # from deadsnakes. The virtual device is skipped since it can't run WebView apps.
      - name: Install the Vega SDK
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.8-dev
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | NONINTERACTIVE=true SKIP_VVD_INSTALL=true bash

      - name: Install dependencies
        run: |
          npm ci
          npm ci --no-audit --no-fund --prefix vega/shell

      # Before the build, since the shell's tsconfig takes in every file under it, and the
      # app copy and build output the build leaves there run tsc and ESLint out of memory.
      - name: Check the shell
        working-directory: vega/shell
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build Vega
        id: build
        run: |
          source ~/vega/env
          npm run package:vega

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: vega
          path: out/Moonfin_Vega_*.vpkg

  build-xbox:
    name: Build Xbox
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Xbox
        id: build
        run: npm run package:xbox

      - name: Zip the package and its dependencies
        shell: pwsh
        run: |
          $msix = Get-Item out/Moonfin_Xbox_v*.msix
          New-Item -ItemType Directory xbox-zip/Dependencies | Out-Null
          Copy-Item $msix xbox-zip/
          Copy-Item xbox/shell/Moonfin.Xbox/AppPackages/*/Dependencies/x64/*.appx xbox-zip/Dependencies/
          if (-not (Get-ChildItem xbox-zip/Dependencies)) { throw 'MSBuild left no dependencies to zip' }
          Compress-Archive xbox-zip/* "out/$($msix.BaseName).zip"

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: xbox
          path: out/Moonfin_Xbox_*.zip

      # Partner Center re-signs what it publishes, so the throwaway certificate build.mjs
      # makes for the Store publisher is all the upload needs. It runs after the zip
      # since each build clears AppPackages.
      - name: Build the Store upload
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run package:xbox -- --store --no-web

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: xbox-store
          path: out/Moonfin_Xbox_Store_*.msixupload

  save-pr-results:
    name: Save PR Build Results
    # Without always() a failed build skips this job, no artifact is uploaded, and
    # the comment workflow has nothing to read, so the run that most needs a comment
    # is the one that never gets one.
    if: always() && github.event_name == 'pull_request'
    needs: [build-webos, build-tizen, build-vega, build-xbox]
    runs-on: ubuntu-26.04
    steps:
      # The job's result, not its build step's, so a check in the job that fails
      # (the Vega shell's) doesn't show as a passing platform.
      - name: Write outcomes.json
        run: |
          cat > outcomes.json <<EOF
          {
            "pr_number": ${{ github.event.pull_request.number }},
            "sha": "${{ github.event.pull_request.head.sha }}",
            "webos": "${{ needs.build-webos.result }}",
            "tizen": "${{ needs.build-tizen.result }}",
            "vega": "${{ needs.build-vega.result }}",
            "xbox": "${{ needs.build-xbox.result }}"
          }
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: build-results
          path: outcomes.json

  # Drafts don't reach TVs, since the app's version check (services/versionChecker.js)
  # reads this repo's releases and skips drafts and prereleases. Publishing the draft is
  # what offers the update.
  release:
    name: Create Draft Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-webos, build-tizen, build-vega, build-xbox]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          # Every artifact holds files from out/ only, so they land at the top of the
          # download. The manifest carries the hash of the ipk uploaded next to it.
          files: |
            Moonfin_webOS_*.ipk
            Moonfin_Tizen_*.wgt
            Moonfin_Vega_*.vpkg
            Moonfin_Xbox_*.zip
            moonfin-ota-*.json
            moonfin-ota-*.bin
            org.moonfin.webos.manifest.json
