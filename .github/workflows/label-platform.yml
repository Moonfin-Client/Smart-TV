name: Auto-label platform and type

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

# Opening an issue fires "opened" alongside one "labeled" per label the form
# applies, so without this several runs reconcile the same labels at once.
concurrency:
  group: label-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply platform and type labels
        uses: actions/github-script@v7
        with:
          script: |
            // Only the relevant section is read. Scanning the whole body matched the
            // platform names in the pull request template's own unticked checkboxes,
            // which put both platforms on every pull request.

            const target = context.payload.issue || context.payload.pull_request;
            const body = target.body || '';
            const number = target.number;

            const HEADING = /^\s{0,3}#{1,6}\s+(.*?)\s*#*\s*$/;
            const CHECKBOX = /^\s*(?:[-*+]\s*)?\[([ xX✓✔☑])\]\s*(.*)$/;

            function section(text, title) {
              const lines = text.split(/\r?\n/);
              let start = -1;
              for (let i = 0; i < lines.length; i++) {
                const m = lines[i].match(HEADING);
                if (m && title.test(m[1].trim())) {
                  start = i + 1;
                  break;
                }
              }
              if (start === -1) return null;
              const out = [];
              for (let i = start; i < lines.length; i++) {
                if (HEADING.test(lines[i])) break;
                out.push(lines[i]);
              }
              return out;
            }

            // Any checkbox at all means the section is a checkbox list, so an unticked
            // box is a no rather than a line to fall back on. Issue form dropdowns have
            // no boxes and print the answer as plain lines.
            function selected(lines) {
              const boxes = lines.map(l => l.match(CHECKBOX)).filter(Boolean);
              if (boxes.length) {
                return boxes.filter(m => m[1] !== ' ').map(m => m[2].trim());
              }
              return lines.map(l => l.trim()).filter(Boolean);
            }

            const PLATFORMS = [
              ['Tizen', /\bTizen\b/i],
              ['webOS', /\bwebOS\b/i]
            ];

            const TYPES = [
              ['Bug', /\bBug\s*fix\b/i],
              ['Feature Request', /\bNew\s*feature\b/i],
              ['Refactor', /\bRefactor\b/i],
              ['Performance', /\bPerformance\b/i],
              ['UI', /\bUI\s*\/\s*UX\b/i],
              ['Documentation', /\bDocumentation\b/i],
              ['Build', /\bBuild\s*\/\s*CI\b/i]
            ];

            const wanted = new Set();
            const managed = new Set();

            // A group is reconciled only when its own section is present, so a pull
            // request never clears the labels an issue form applied.
            function apply(table, items) {
              for (const [label] of table) managed.add(label);
              for (const item of items.filter(i => !/^other\b/i.test(i))) {
                for (const [label, regex] of table) {
                  if (regex.test(item)) wanted.add(label);
                }
              }
            }

            const platformLines = section(body, /^platform(\(s\))?\b/i);
            if (platformLines) {
              const items = selected(platformLines);
              // With only two platforms, "Both" is worth spelling out as both labels so
              // filtering by one platform still finds the shared work.
              const both = items.some(i => /^both\b/i.test(i));
              apply(PLATFORMS, both ? ['Tizen', 'webOS'] : items);
            }

            const typeLines = section(body, /^type of change\b/i);
            if (typeLines) apply(TYPES, selected(typeLines));

            if (!managed.size) {
              core.info('No Platform or Type of Change section found, leaving labels alone.');
              return;
            }

            const { data: existing } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100
            });
            const current = new Set(existing.map(l => l.name));

            const addLabels = [...wanted].filter(l => !current.has(l));
            const removeLabels = [...managed].filter(l => current.has(l) && !wanted.has(l));

            if (addLabels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                labels: addLabels
              });
            }

            for (const label of removeLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  name: label
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
